name: HRM Private MinIO Integration

on:
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/Api/V1/PersonnelDocumentFileController.php'
      - 'config/filesystems.php'
      - 'tests/Feature/PersonnelDocumentMinioLiveTest.php'
      - 'app/Console/Commands/MigratePersonnelDocumentsToMinio.php'
      - 'tests/Feature/PersonnelDocumentMigrationTest.php'
      - '.github/workflows/private-minio-integration.yml'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - 'app/Http/Controllers/Api/V1/PersonnelDocumentFileController.php'
      - 'config/filesystems.php'
      - 'tests/Feature/PersonnelDocumentMinioLiveTest.php'
      - 'app/Console/Commands/MigratePersonnelDocumentsToMinio.php'
      - 'tests/Feature/PersonnelDocumentMigrationTest.php'
      - '.github/workflows/private-minio-integration.yml'
      - 'composer.json'
      - 'composer.lock'

jobs:
  synthetic-private-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AWS_EC2_METADATA_DISABLED: 'true'
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: hrm-ci-private
      MINIO_ACCESS_KEY: synthetic-ci-minio
      MINIO_SECRET_KEY: synthetic-ci-only-secret-for-ephemeral-minio
      HRM_RUN_MINIO_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: exif, gd, mbstring, pdo_sqlite, sqlite3, curl, fileinfo
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false
      - name: Create isolated application test environment
        run: echo APP_ENV=testing > .env
      - name: Install exact Laravel dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Build official pinned MinIO CE release from its archived source
        run: |
          set -euo pipefail
          # The historical upstream MinIO repository is read-only. CI uses only
          # synthetic files and never exposes port 9000 outside this runner.
          git clone --depth 1 --branch RELEASE.2025-10-15T17-29-55Z \
            https://github.com/minio/minio.git "$RUNNER_TEMP/minio-ci-source"
          (cd "$RUNNER_TEMP/minio-ci-source" && go build -trimpath -o "$RUNNER_TEMP/minio-ci" .)
      - name: Start ephemeral MinIO without a third-party container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hrm-minio-data"
          MINIO_ROOT_USER="$MINIO_ACCESS_KEY" MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            "$RUNNER_TEMP/minio-ci" server "$RUNNER_TEMP/hrm-minio-data" \
              --address ":9000" > "$RUNNER_TEMP/hrm-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/hrm-minio.pid"
          ready=0
          for i in $(seq 1 60); do
            if curl --silent --fail "http://127.0.0.1:9000/minio/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat "$RUNNER_TEMP/hrm-minio.log"; exit 1; fi
      - name: Provision isolated PRIVATE bucket using CI credentials
        run: |
          php -r '
          require "vendor/autoload.php";
          $s3 = new Aws\S3\S3Client([
            "version" => "latest",
            "region" => "us-east-1",
            "endpoint" => getenv("MINIO_ENDPOINT"),
            "use_path_style_endpoint" => true,
            "credentials" => [
              "key" => getenv("MINIO_ACCESS_KEY"),
              "secret" => getenv("MINIO_SECRET_KEY"),
            ],
          ]);
          $s3->createBucket(["Bucket" => getenv("MINIO_BUCKET")]);
          '
      - name: Validate Laravel access controls against REAL MinIO
        run: php artisan test --filter=PersonnelDocumentMinioLiveTest --display-warnings --fail-on-warning
      - name: Dispose of temporary MinIO
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hrm-minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/hrm-minio.pid")" || true
          fi
          if [ -f "$RUNNER_TEMP/hrm-minio.log" ]; then
            tail -n 50 "$RUNNER_TEMP/hrm-minio.log"
          fi
